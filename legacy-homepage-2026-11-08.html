<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryaan Jewellers | Ultra Premium Luxury Jewelry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F4E9D1;
            --gold-dark: #B8860B;
            --platinum: #E5E4E2;
            --silver: #C0C0C0;
            --diamond: #F0F8FF;
            --dark: #0A0A0A;
            --dark-gray: #1A1A1A;
            --light: #FAF9F6;
            --white: #FFFFFF;
            --card-bg: #FFFFFF;
            --text-primary: #0A0A0A;
            --text-secondary: #666666;
            --border-color: #EEEEEE;
            --shadow-soft: 0 5px 20px rgba(0, 0, 0, 0.05);
            --shadow-medium: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-hard: 0 20px 50px rgba(0, 0, 0, 0.15);
            --transition-smooth: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .theme-dark {
            --gold: #D4AF37;
            --gold-light: #F4E9D1;
            --gold-dark: #B8860B;
            --dark: #FAF9F6;
            --dark-gray: #EEEEEE;
            --light: #0A0A0A;
            --white: #1A1A1A;
            --card-bg: #1A1A1A;
            --text-primary: #FFFFFF;
            --text-secondary: #AAAAAA;
            --border-color: #333333;
            --shadow-soft: 0 5px 20px rgba(0, 0, 0, 0.3);
            --shadow-medium: 0 10px 30px rgba(0, 0, 0, 0.4);
            --shadow-hard: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.8;
            color: var(--text-primary);
            background-color: var(--light);
            overflow-x: hidden;
            font-weight: 300;
            transition: var(--transition-smooth);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            line-height: 1.3;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* Header Controls */
        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .language-selector, .theme-toggler, .social-media-btn {
            position: relative;
        }

        .language-btn, .theme-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: var(--transition-smooth);
            color: var(--text-primary);
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
        }

        .language-btn:hover, .theme-btn:hover {
            border-color: var(--gold);
        }

        .theme-btn:hover {
            transform: rotate(30deg);
        }

        .flag-icon {
            width: 20px;
            height: 15px;
            object-fit: cover;
            border-radius: 2px;
        }

        .language-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            min-width: 150px;
            display: none;
            flex-direction: column;
            z-index: 1001;
            box-shadow: var(--shadow-medium);
        }

        .language-dropdown.active {
            display: flex;
        }

        .language-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            color: var(--text-primary);
            text-decoration: none;
            transition: var(--transition-smooth);
            border-bottom: 1px solid var(--border-color);
        }

        .language-option:last-child {
            border-bottom: none;
        }

        .language-option:hover {
            background: var(--gold-light);
            color: var(--dark);
        }

        /* Products Section Controls */
        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .products-filter {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 25px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 5px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--dark);
        }

        .view-toggle {
            display: flex;
            gap: 10px;
        }

        .view-btn {
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            color: var(--text-secondary);
        }

        .view-btn.active {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--dark);
        }

        .view-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Products Layout Views */
        .products-grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .products-list-view {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .products-list-view .product-card {
            display: flex;
            height: 200px;
        }

        .products-list-view .product-image {
            width: 200px;
            height: 100%;
            flex-shrink: 0;
        }

        .products-list-view .product-info {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .products-list-view .product-actions {
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            flex-direction: column;
            gap: 10px;
        }

        .products-list-view .product-description {
            display: block;
            margin-top: 10px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Product Cards */
        .product-card {
            background: var(--card-bg);
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-medium);
        }

        .product-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--gold);
            color: var(--dark);
            padding: 8px 15px;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 2;
            border-radius: 5px;
        }

        .product-image {
            height: 400px;
            background: var(--dark-gray);
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .product-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: translateX(100px);
            transition: var(--transition-smooth);
        }

        .product-card:hover .product-actions {
            transform: translateX(0);
        }

        .product-action {
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-soft);
        }

        .product-action:hover {
            background: var(--gold);
            color: var(--dark);
            transform: scale(1.1);
        }

        .product-info {
            padding: 25px;
        }

        .product-category {
            font-size: 12px;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .product-description {
            display: none;
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.6;
        }

        .product-price {
            font-size: 1.3rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Product Image Zoom */
        .zoom-container {
            position: relative;
            overflow: hidden;
            cursor: zoom-in;
        }

        .zoom-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .zoom-container.zoomed {
            cursor: zoom-out;
        }

        .zoom-container.zoomed .zoom-overlay {
            opacity: 1;
        }

        /* Social Feed */
        .social-feed {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .social-post {
            position: relative;
            height: 200px;
            background: var(--dark-gray);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
        }

        .social-post img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .social-post:hover img {
            transform: scale(1.1);
        }

        .social-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 15px;
            color: white;
            transform: translateY(100%);
            transition: var(--transition-smooth);
        }

        .social-post:hover .social-overlay {
            transform: translateY(0);
        }

        /* Testimonial Slider */
        .testimonial-slider {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            overflow: hidden;
        }

        .testimonial-track {
            display: flex;
            transition: transform 0.8s ease;
        }

        .testimonial-slide {
            min-width: 100%;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: var(--shadow-soft);
            text-align: center;
        }

        .testimonial-text {
            font-size: 1.2rem;
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .testimonial-author {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .author-avatar {
            width: 60px;
            height: 60px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
            font-size: 1.5rem;
        }

        .slider-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .slider-dot {
            width: 12px;
            height: 12px;
            background: var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .slider-dot.active {
            background: var(--gold);
            transform: scale(1.2);
        }

        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            color: var(--text-primary);
        }

        .slider-arrow:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--dark);
        }

        .slider-arrow.prev {
            left: 20px;
        }

        .slider-arrow.next {
            right: 20px;
        }

        /* Mission & Vision */
        .mission-vision-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 60px;
        }

        .mission-card, .vision-card {
            padding: 40px;
            background: var(--card-bg);
            border-radius: 10px;
            text-align: center;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
        }

        .mission-card:hover, .vision-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-medium);
        }

        .mission-icon, .vision-icon {
            width: 80px;
            height: 80px;
            background: var(--gold-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            color: var(--gold);
            font-size: 2rem;
        }

        /* Success Stories */
        .stories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .story-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
        }

        .story-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-medium);
        }

        .story-image {
            height: 200px;
            background: var(--dark-gray);
            position: relative;
            overflow: hidden;
        }

        .story-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .story-card:hover .story-image img {
            transform: scale(1.1);
        }

        .story-content {
            padding: 30px;
        }

        .story-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .story-meta i {
            color: var(--gold);
        }

        /* WhatsApp Floating Button */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.3);
            z-index: 1000;
            transition: var(--transition-bounce);
        }

        .whatsapp-float:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 15px 40px rgba(37, 211, 102, 0.4);
        }

        /* Modals */
        .social-modal, .contact-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1002;
        }

        .social-modal.active, .contact-modal.active {
            display: flex;
        }

        .social-modal-content, .contact-modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 500px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .contact-modal-content {
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .social-modal-header {
            padding: 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .social-modal-body, .modal-body {
            padding: 25px;
        }

        .social-links-modal {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-link-modal {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--light);
            border-radius: 5px;
            color: var(--text-primary);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .social-link-modal:hover {
            background: var(--gold-light);
            color: var(--dark);
        }

        .social-link-modal i {
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* Loading Screen */
        .luxury-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .luxury-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .diamond-loader {
            width: 80px;
            height: 80px;
            position: relative;
            margin-bottom: 40px;
        }

        .diamond-loader:before,
        .diamond-loader:after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid var(--gold);
            animation: diamondRotate 2s linear infinite;
        }

        .diamond-loader:after {
            animation-delay: 1s;
            border-color: var(--silver);
        }

        @keyframes diamondRotate {
            0% { transform: rotate(0deg) scale(1); opacity: 1; }
            50% { transform: rotate(180deg) scale(0.8); opacity: 0.5; }
            100% { transform: rotate(360deg) scale(1); opacity: 1; }
        }

        .luxury-loader p {
            color: var(--gold-light);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Header */
        .luxury-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            transition: var(--transition-smooth);
        }

        .theme-dark .luxury-header {
            background: rgba(26, 26, 26, 0.95);
        }

        .luxury-header.scrolled {
            padding: 10px 0;
            box-shadow: var(--shadow-soft);
        }

        .header-top-bar {
            background: var(--dark);
            color: var(--gold-light);
            padding: 8px 0;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .theme-dark .header-top-bar {
            background: #000;
        }

        .header-top-bar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-header {
            padding: 20px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .luxury-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .luxury-logo-icon {
            font-size: 28px;
            color: var(--gold);
            margin-right: 12px;
        }

        .luxury-logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 2px;
        }

        .luxury-logo-text span {
            color: var(--gold);
        }

        .luxury-nav {
            display: flex;
            gap: 40px;
        }

        .luxury-nav a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            padding: 5px 0;
            transition: var(--transition-smooth);
        }

        .luxury-nav a:before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.3s ease;
        }

        .luxury-nav a:hover:before,
        .luxury-nav a.active:before {
            width: 100%;
        }

        .luxury-nav a:hover,
        .luxury-nav a.active {
            color: var(--gold);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .header-action {
            position: relative;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .header-action:hover {
            color: var(--gold);
            transform: translateY(-2px);
        }

        .action-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--gold);
            color: white;
            font-size: 10px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .mobile-menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
        }

        /* Hero Section */
        .luxury-hero {
            min-height: 100vh;
            background: linear-gradient(rgba(10, 10, 10, 0.85), rgba(10, 10, 10, 0.9)), 
                        url('https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 800px;
            margin-left: 10%;
            color: var(--light);
            z-index: 2;
        }

        .hero-subtitle {
            font-size: 16px;
            letter-spacing: 4px;
            color: var(--gold);
            margin-bottom: 20px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.2s forwards;
        }

        .hero-title {
            font-size: 5.5rem;
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.4s forwards;
        }

        .hero-title span {
            color: var(--gold);
            font-weight: 400;
        }

        .hero-description {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.8);
            max-width: 600px;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.6s forwards;
        }

        /* Buttons */
        .luxury-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px 45px;
            background: var(--gold);
            color: var(--dark);
            border: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition-bounce);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            font-weight: 600;
        }

        .luxury-btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.7s ease;
        }

        .luxury-btn:hover:before {
            left: 100%;
        }

        .luxury-btn:hover {
            background: var(--gold-dark);
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.3);
        }

        .luxury-btn-ghost {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: var(--light);
        }

        .luxury-btn-ghost:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
        }

        /* Diamond Particles */
        .diamond-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .diamond-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* Section Styling */
        .section-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .section-subtitle {
            font-size: 14px;
            letter-spacing: 3px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 3.5rem;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .section-description {
            max-width: 600px;
            margin: 0 auto;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .text-center {
            text-align: center;
            margin-top: 40px;
        }

        /* Mobile Navigation */
        .mobile-nav {
            position: fixed;
            top: 0;
            left: -100%;
            width: 300px;
            height: 100vh;
            background: var(--card-bg);
            z-index: 1002;
            box-shadow: var(--shadow-hard);
            transition: var(--transition-smooth);
            padding: 100px 40px;
        }

        .mobile-nav.active {
            left: 0;
        }

        .mobile-nav-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .mobile-nav-content a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 18px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Search Overlay */
        .search-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1001;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding-top: 150px;
        }

        .theme-dark .search-overlay {
            background: rgba(10, 10, 10, 0.98);
        }

        .search-overlay.active {
            display: flex;
        }

        .search-container {
            width: 90%;
            max-width: 800px;
        }

        .search-container input {
            width: 100%;
            padding: 25px 0;
            font-size: 2rem;
            border: none;
            border-bottom: 2px solid var(--gold);
            background: transparent;
            outline: none;
            color: var(--text-primary);
            font-family: 'Cormorant Garamond', serif;
        }

        .search-results {
            margin-top: 40px;
            max-height: 400px;
            overflow-y: auto;
        }

        .search-result-item {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .search-result-item:hover {
            background: var(--gold-light);
            padding-left: 30px;
        }

        .search-result-title {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .search-result-price {
            color: var(--gold);
            font-weight: 600;
        }

        /* Form Controls */
        .form-control {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            border-radius: 5px;
            font-size: 16px;
            transition: var(--transition-smooth);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .modal-close:hover {
            color: var(--gold);
            transform: rotate(90deg);
        }

        /* Footer */
        .luxury-footer {
            background: var(--dark);
            color: var(--gold-light);
            padding: 80px 0 40px;
            margin-top: 100px;
        }

        .theme-dark .luxury-footer {
            background: #000;
        }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 60px;
            margin-bottom: 60px;
        }

        .footer-column {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .footer-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            color: var(--gold);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-description {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            font-size: 15px;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .social-link {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-light);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .social-link:hover {
            background: var(--gold);
            color: var(--dark);
            transform: translateY(-5px);
        }

        .footer-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .footer-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .footer-links li a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .footer-links li a:hover {
            color: var(--gold);
            padding-left: 10px;
        }

        .footer-bottom {
            text-align: center;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .container {
                padding: 0 30px;
            }
        }

        @media (max-width: 992px) {
            .products-list-view .product-card {
                flex-direction: column;
                height: auto;
            }

            .products-list-view .product-image {
                width: 100%;
                height: 300px;
            }

            .products-list-view .product-actions {
                top: 20px;
                right: 20px;
                transform: none;
            }

            .slider-arrow {
                width: 40px;
                height: 40px;
                font-size: 14px;
            }

            .hero-title {
                font-size: 4rem;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 20px;
            }

            .header-controls {
                gap: 10px;
            }

            .view-toggle {
                margin-left: 0;
            }

            .testimonial-slide {
                padding: 30px 20px;
            }

            .mission-card, .vision-card {
                padding: 30px 20px;
            }

            .mobile-menu-toggle {
                display: block;
            }

            .luxury-nav {
                display: none;
            }

            .hero-content {
                margin-left: 5%;
                margin-right: 5%;
                text-align: center;
            }

            .hero-title {
                font-size: 3rem;
            }

            .hero-description {
                font-size: 1rem;
            }

            .footer-content {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .footer-bottom {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .language-btn span, .view-btn span {
                display: none;
            }

            .social-feed {
                grid-template-columns: repeat(2, 1fr);
            }

            .products-filter {
                justify-content: center;
            }

            .filter-btn {
                padding: 10px 15px;
                font-size: 12px;
            }

            .section-title {
                font-size: 2.5rem;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate {
            animation: fadeInUp 0.8s ease forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--light);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold-dark);
        }
    </style>
